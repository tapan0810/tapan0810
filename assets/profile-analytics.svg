<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">GitHub public repository analytics</title>
<desc id="desc">Live profile analytics are generated by GitHub Actions from GitHub's public REST API.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F36"/><stop offset="1" stop-color="#172D4D"/></linearGradient></defs>
<rect width="1000" height="390" rx="18" fill="url(#bg)"/>
<text x="40" y="62" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">GITHUB PUBLIC REPOSITORY ANALYTICS</text>
<text x="40" y="112" fill="#C7D8EE" font-family="Segoe UI,Arial,sans-serif" font-size="18">Generating your live repository, star, fork, follower and language snapshot.</text>
<text x="40" y="158" fill="#8FC3FF" font-family="Segoe UI,Arial,sans-serif" font-size="15">This card is maintained by your own GitHub Actions workflow.</text>
</svg>