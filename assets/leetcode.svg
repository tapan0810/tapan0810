<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
<title id="title">LeetCode dashboard initializing</title>
<desc id="desc">The live LeetCode card will be generated automatically by GitHub Actions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f36"/><stop offset="1" stop-color="#174a7e"/></linearGradient></defs>
<rect width="1000" height="220" rx="18" fill="url(#bg)"/>
<text x="48" y="78" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">LeetCode · tapan-ray</text>
<text x="48" y="124" fill="#c7d8ee" font-family="Segoe UI,Arial,sans-serif" font-size="19">Live problem, skill and recent-submission statistics</text>
<text x="48" y="170" fill="#8fc3ff" font-family="Segoe UI,Arial,sans-serif" font-size="16">Dashboard initializes on the first successful Generate LeetCode Stats run.</text>
