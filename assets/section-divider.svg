<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-labelledby="title desc">
  <title id="title">Unified blue section divider</title>
  <desc id="desc">A subtle navy to blue line with a cyan accent to unify the profile sections.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173B61"/>
      <stop offset=".48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#173B61" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1200" height="2" rx="1" fill="url(#line)"/>
  <rect x="0" y="4" width="78" height="6" rx="3" fill="url(#glow)"/>
  <circle cx="86" cy="7" r="3" fill="#7DD3FC"/>
</svg>