<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Tapan Ray — Software Engineer</title>
  <desc id="desc">Animated navy and electric-blue developer banner with subtle orbiting nodes, a moving scan line, and rotating engineering specialisms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset=".52" stop-color="#0B2340"/>
      <stop offset="1" stop-color="#123F70"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163B61" stop-opacity=".94"/>
      <stop offset="1" stop-color="#081B31" stop-opacity=".96"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9CCBFA" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shine"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="1025" cy="155" r="250" fill="url(#glow)"/>
    <circle cx="1120" cy="10" r="160" fill="#2563EB" opacity=".12" filter="url(#blur)">
      <animate attributeName="opacity" values=".08;.19;.08" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 284C180 232 310 326 510 280S875 220 1200 286V340H0Z" fill="#020B16" opacity=".35"/>
    <path d="M0 0H9V340H0Z" fill="url(#blue)"/>
    <path d="M42 52H78" stroke="#67E8F9" stroke-width="4" stroke-linecap="round"/>
    <text x="42" y="82" fill="#93C5FD" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">SOFTWARE ENGINEERING  /  FULL-STACK  /  CLOUD  /  AI</text>
    <text x="39" y="164" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2">Tapan Ray</text>
    <text x="43" y="204" fill="#DCEBFA" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" letter-spacing=".8">SOFTWARE ENGINEER</text>

    <g font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#9CCBFA">
      <text x="43" y="242" opacity="1">.NET &amp; Cloud Engineering
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.27;.33;.94;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="43" y="242" opacity="0">Building Reliable Enterprise Systems
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.27;.33;.61;.67" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="43" y="242" opacity="0">Exploring AI &amp; Agentic Applications
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.61;.67;.94;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <g transform="translate(43 270)" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      <rect width="104" height="31" rx="15.5" fill="#12395E" stroke="#38BDF8" stroke-opacity=".65"/>
      <text x="52" y="20" fill="#DDF4FF">C# / .NET</text>
      <rect x="114" width="104" height="31" rx="15.5" fill="#12395E" stroke="#38BDF8" stroke-opacity=".65"/>
      <text x="166" y="20" fill="#DDF4FF">ANGULAR</text>
      <rect x="228" width="94" height="31" rx="15.5" fill="#12395E" stroke="#38BDF8" stroke-opacity=".65"/>
      <text x="275" y="20" fill="#DDF4FF">AZURE</text>
      <rect x="332" width="116" height="31" rx="15.5" fill="#12395E" stroke="#38BDF8" stroke-opacity=".65"/>
      <text x="390" y="20" fill="#DDF4FF">GENERATIVE AI</text>
    </g>

    <g transform="translate(770 45)">
      <rect width="385" height="245" rx="20" fill="url(#glass)" stroke="#60A5FA" stroke-opacity=".42"/>
      <text x="23" y="30" fill="#8FBCE9" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2.2">ENGINEERING ECOSYSTEM</text>
      <circle cx="193" cy="135" r="78" fill="none" stroke="#60A5FA" stroke-opacity=".35" stroke-dasharray="3 8"/>
      <circle cx="193" cy="135" r="59" fill="#0B2B4A" stroke="#38BDF8" stroke-opacity=".65" stroke-width="1.5"/>
      <circle cx="193" cy="135" r="48" fill="none" stroke="#60A5FA" stroke-opacity=".28"/>
      <circle cx="193" cy="135" r="85" fill="none" stroke="#38BDF8" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="30 250">
        <animateTransform attributeName="transform" type="rotate" from="0 193 135" to="360 193 135" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="193" cy="135" r="4" fill="#67E8F9">
        <animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;1;.7" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="193" y="131" fill="#FFFFFF" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="750">DEV</text>
      <text x="193" y="153" fill="#9CCBFA" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.8">BUILD · SHIP · IMPROVE</text>

      <g font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        <rect x="22" y="57" width="72" height="34" rx="9" fill="#102F50" stroke="#4F93CF" stroke-opacity=".65"/>
        <text x="58" y="79" fill="#D6ECFF">API</text>
        <rect x="291" y="57" width="72" height="34" rx="9" fill="#102F50" stroke="#4F93CF" stroke-opacity=".65"/>
        <text x="327" y="79" fill="#D6ECFF">CLOUD</text>
        <rect x="22" y="180" width="72" height="34" rx="9" fill="#102F50" stroke="#4F93CF" stroke-opacity=".65"/>
        <text x="58" y="202" fill="#D6ECFF">DATA</text>
        <rect x="291" y="180" width="72" height="34" rx="9" fill="#102F50" stroke="#4F93CF" stroke-opacity=".65"/>
        <text x="327" y="202" fill="#D6ECFF">AI</text>
      </g>
      <g fill="none" stroke="#5BA8EA" stroke-opacity=".5" stroke-width="1.3">
        <path d="M94 74L137 103M291 74L249 103M94 197L137 166M291 197L249 166"/>
      </g>
      <circle cx="193" cy="50" r="3" fill="#67E8F9">
        <animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M770 313H1155" stroke="url(#blue)" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <path d="M770 313H1155" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" opacity=".18" filter="url(#shine)">
      <animate attributeName="stroke-dasharray" values="0 385;100 285;0 385" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M700 0L700 340" stroke="#60A5FA" stroke-opacity=".08"/>
  </g>
</svg>