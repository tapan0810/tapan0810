<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Tapan Ray — .NET Full-Stack Engineer and AI Application Developer</title>
  <desc id="desc">A premium navy and blue engineering banner featuring .NET full-stack development, cloud engineering, and AI application development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07182B"/>
      <stop offset="52%" stop-color="#102D4D"/>
      <stop offset="100%" stop-color="#174A83"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173B61" stop-opacity=".96"/>
      <stop offset="100%" stop-color="#0D2139" stop-opacity=".96"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8DB9E8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="310" rx="22" fill="url(#bg)"/>
