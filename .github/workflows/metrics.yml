name: Generate GitHub Metrics

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: \${{ secrets.METRICS_TOKEN }}
          user: tapan0810
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_repositories: yes
          plugin_repositories_featured: tapan0810/FlowOps, tapan0810/DotNet_Angular_App_1_StudentAPI, tapan0810/github-analytics-pro, tapan0810/ResumeIQ-AI
          config_order: base.header, base.activity, isocalendar, languages, habits, achievements, repositories
