name: Generate LeetCode Stats

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/leetcode.yml"

permissions:
  contents: write

jobs:
  leetcode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate LeetCode profile card
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: tapan0810
          filename: assets/leetcode.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_leetcode: yes
          plugin_leetcode_user: tapan-ray
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 8
          plugin_leetcode_limit_recent: 5
