name: Generate LeetCode Stats

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/leetcode.yml"
      - ".github/scripts/generate-leetcode-card.mjs"

permissions:
  contents: write

concurrency:
  group: leetcode-profile-card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  leetcode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate raw LeetCode statistics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: tapan0810
          filename: assets/leetcode-source.svg
          output_action: none
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: regular
          config_padding: "0, 0"
          plugin_leetcode: yes
          plugin_leetcode_user: tapan-ray
          plugin_leetcode_sections: solved

      - name: Render custom LeetCode dashboard
        run: node .github/scripts/generate-leetcode-card.mjs

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode.svg
          if git diff --cached --quiet; then
            echo "LeetCode dashboard is already up to date."
          else
            git commit -m "Update LeetCode dashboard"
            git push
          fi
