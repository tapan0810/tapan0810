name: Generate LeetCode Stats

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/leetcode.yml"

permissions:
  contents: write

concurrency:
  group: leetcode-profile-card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  leetcode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate compact LeetCode solved summary
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: tapan0810
          filename: assets/leetcode.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_display: regular
          config_padding: "0, 0"
          plugin_leetcode: yes
          plugin_leetcode_user: tapan-ray
          plugin_leetcode_sections: solved
