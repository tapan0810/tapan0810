name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download cards
        run: |

          download() {

            NAME=$1
            URL=$2

            echo "Downloading $NAME..."

            TMP=$(mktemp)

            if curl \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --fail \
              -A "Mozilla/5.0" \
              "$URL" \
              -o "$TMP"
            then

              if grep -qi "<svg" "$TMP"; then
                mv "$TMP" "assets/$NAME"
                echo "✅ Updated $NAME"
              else
                echo "⚠ Invalid SVG for $NAME"
              fi

            else
              echo "⚠ Failed downloading $NAME"
            fi

            rm -f "$TMP"

          }

          download github-stats.svg "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true"

          download top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true"

          download streak-stats.svg "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true"

          download trophies.svg "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&row=1&column=6"

          download activity-graph.svg "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=tokyo-night&hide_border=true&area=true"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile stats"
            git push
          fi
