name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download profile SVG cards
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          download() {
            local name="$1"
            local url="$2"
            local tmp
            tmp="$(mktemp)"

            echo "Downloading $name"

            if curl --location --retry 4 --retry-delay 3 --retry-all-errors --fail --silent --show-error -A "Mozilla/5.0" "$url" -o "$tmp"; then
              if grep -qi "<svg" "$tmp" && ! grep -qi "DEPLOYMENT_DISABLED\|Payment required" "$tmp"; then
                mv "$tmp" "assets/$name"
                echo "Updated $name"
              else
                echo "The response for $name was not a valid SVG; keeping the last known good asset."
                rm -f "$tmp"
              fi
            else
              echo "Could not refresh $name; keeping the last known good asset."
              rm -f "$tmp"
            fi
          }

          download github-stats.svg "https://github-readme-stats.vercel.app/api?username=$OWNER&show_icons=true&theme=tokyonight&hide_border=true"
          download top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=$OWNER&layout=compact&theme=tokyonight&hide_border=true&langs_count=6"
          download streak-stats.svg "https://streak-stats.demolab.com/?user=$OWNER&theme=tokyonight&hide_border=true"
          download activity-graph.svg "https://github-readme-activity-graph.vercel.app/graph?username=$OWNER&theme=tokyo-night&hide_border=true&area=true"

      - name: Commit and push refreshed SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/streak-stats.svg assets/activity-graph.svg

          if git diff --cached --quiet; then
            echo "All profile cards are already up to date."
            exit 0
          fi

          git commit -m "chore: refresh profile analytics cards [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Profile analytics cards pushed successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 3
          done

          echo "Could not push profile cards after three attempts."
          exit 1
